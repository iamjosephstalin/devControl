<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Terminal window frame -->
  <rect x="8" y="12" width="48" height="40" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <!-- Terminal header with dots -->
  <rect x="8" y="12" width="48" height="8" rx="4" fill="#334155"/>
  <circle cx="14" cy="16" r="1.5" fill="#ef4444"/>
  <circle cx="19" cy="16" r="1.5" fill="#f59e0b"/>
  <circle cx="24" cy="16" r="1.5" fill="#10b981"/>
  <!-- Terminal content area -->
  <rect x="10" y="22" width="44" height="28" fill="#0f172a"/>
  <!-- Terminal prompt and cursor -->
  <text x="12" y="28" font-family="JetBrains Mono, monospace" font-size="4" fill="#22d3ee" font-weight="500">$</text>
  <line x1="16" y1="26" x2="20" y2="26" stroke="#22d3ee" stroke-width="0.5"/>
  <!-- Code lines -->
  <line x1="12" y1="32" x2="28" y2="32" stroke="#64748b" stroke-width="0.5"/>
  <line x1="12" y1="35" x2="35" y2="35" stroke="#64748b" stroke-width="0.5"/>
  <line x1="12" y1="38" x2="24" y2="38" stroke="#64748b" stroke-width="0.5"/>
  <!-- Cursor blink -->
  <rect x="26" y="36.5" width="1" height="3" fill="#22d3ee" opacity="0.8"/>
  <!-- Subtle glow effect -->
  <rect x="10" y="22" width="44" height="28" fill="url(#terminalGlow)" opacity="0.1"/>
  <defs>
    <linearGradient id="terminalGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>
